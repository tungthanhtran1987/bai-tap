<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>register-layout</title>
        <link rel="stylesheet" href="./assets/css/style.css" />
    </head>
    <body>
        <div class="register-wrapper">
            <div class="register-container">
                <div class="register-img-box">
                    <img src="./assets/img/anh-phong-canh-chill-29.jpg" alt="anh" class="register-img"/>
                </div>
                <form action="" class="register-form">
                    <div class="form-group">
                        <label for="display-name" class="form-label">Display name:</label>
                        <input
                            type="text"
                            id="display-name"
                            name="display-name"
                            class="form-control"
                            placeholder="Display name..."
                            spellcheck="false"
                        />
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Email..."
                            spellcheck="false"
                        />
                    </div>

                    <div class="form-group">
                        <label for="phone-number" class="form-label">Phone Number:</label>
                        <input
                            type="tel"
                            id="phone-number"
                            name="phone-number"
                            class="form-control"
                            placeholder="Phone Number..."
                            spellcheck="false"
                            pattern="[0-9]+"
                        />
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password:</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Password..."
                            minlength="6"
                        />
                    </div>

                    <div class="form-group">
                        <label for="confirm-password" class="form-label">Confirm Password:</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            class="form-control"
                            placeholder="Confirm Password..."
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Gender:</label>
                        <input type="radio" id="male" class="form-check-input" name="gender" value="male" /><label
                            for="male"
                            class="form-check-label"
                            >Male</label
                        >
                        <input type="radio" id="female" class="form-check-input" name="gender" value="female" /><label
                            for="female"
                            class="form-check-label"
                            >Female</label
                        >
                        <input type="radio" id="other" class="form-check-input" name="gender" value="other" /><label
                            for="other"
                            class="form-check-label"
                            >Other</label
                        >
                    </div>

                    <div class="form-group">
                        <label for="date-of-birth" class="form-label">Date of Birth:</label>
                        <input type="date" id="date-of-birth" name="date-of-birth" class="form-control" />
                    </div>

                    <div class="form-group">
                        <label for="address" class="form-label">Address:</label>
                        <input
                            type="text"
                            id="address"
                            name="address"
                            class="form-control"
                            placeholder="Address..."
                            spellcheck="false"
                        />
                    </div>

                    <div class="form-group">
                        <button class="btn-submit">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
