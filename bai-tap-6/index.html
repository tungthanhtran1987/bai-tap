<!doctype html>
<html lang="en">
    <head>

        <title>Menu bài tập Day 5</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #dcf5f2;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    "Open Sans",
                    "Helvetica Neue",
                    sans-serif;
            }

            .container {
                /* border: 1px solid red; */
                max-width: 1000px;
                margin: 0 auto;
                min-height: 100vh;
                padding: 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                
            }

                color: rgb(38, 85, 151);
            }

            .card-list {

                display: flex;
                justify-content: center;
                gap: 20px;
                flex-wrap: wrap;
                margin: auto 0;
            }

            .card {
                border: 1px solid green;
                width: 200px;
                padding: 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 300px;
                border-radius: 10px;
                background: white;
            }

            .card-title {
                font-size: 1.2rem;
                color: #054032;
            }

            .btn {
                text-decoration: none;
                border: 1px solid #6a0dad;
                padding: 10px 20px;
                cursor: pointer;
                border-radius: 5px;
                margin: auto;
            }

            .btn:hover {
                background-color: #6a0dad;
                color: #ffffff;
            }
        </style>
    </head>
